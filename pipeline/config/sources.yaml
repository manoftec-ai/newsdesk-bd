# jachaidesk — sources (Phase 1, verified by probe 2026-09-19)
# method: rss | scraper (plain HTML) | headless (JS/403-protected browser)

site:
  codename: jachaidesk
  titleBn: যাচাইডেস্ক
  taglineBn: বাংলাদেশের সবচেয়ে যাচাই-করা সংবাদ
  lang: bn
  url: https://jachaidesk.com
  cadence_minutes: 30

# Destination site categories
categories:
  - জাতীয়
  - রাজনীতি
  - অর্থনীতি
  - আন্তর্জাতিক
  - ক্রীড়া
  - বিনোদন
  - প্রযুক্তি
  - মতামত/বিশ্লেষণ
  - সর্বশেষ

# Verification tiers (category -> tier)
tiers:
  A: [জাতীয়, রাজনীতি, অর্থনীতি, আন্তর্জাতিক]
  B: [ক্রীড়া, বিনোদন, প্রযুক্তি]
  C: [মতামত/বিশ্লেষণ]
  all: সর্বশেষ

# AI provider (swap = change provider; see ARCHITECTURE.md §5)
ai:
  provider: local   # local | gemini
  local:
    model: Qwen2.5-3B-Instruct-Q4_K_M
    server: http://127.0.0.1:8082
    openaiCompat: true
  gemini:
    model: gemini-2.0-flash
    apiKeyEnv: GEMINI_API_KEY

# Polling behavior
poll:
  min_interval_minutes: 30      # per-source floor; never fetch faster than this
  dedupe_title_similarity: 0.92 # 0..1, drop items whose title matches this strongly
  cluster_window_hours: 8       # only cluster items from the last 8h
  cluster_similarity: 0.30      # tuned on config/golden.json (2026-09-24: F1 0.625→0.952 at sim 0.30; fixes same-event-different-words dup hole, precision stays 1.000 on traps)
  cluster_strong_sim: 0.30    # P0-9 hybrid: strong-token agreement floor (numbers/rare vocab); + strong 0.30 => golden F1 1.000, P=1.0 R=1.0
  cluster_prune_sim: 0.35       # centroid outlier prune (removes single-linkage grab-away members)
  cluster_mature_runs: 3        # runs with no new member before story is written

# VERIFY scoring (ARCHITECTURE.md §4A). Corroboration-based today; official/search/FB
# signals plug in as a provider later — same model.
verify:
  paper_points: 2              # per distinct reputable paper agreeing
  official_points: 3           # official/agency channel confirming
  eyewitness_points: 0.5       # eyewitness/journalist account
  contradiction_penalty: -1    # per contradicting public comment (red flag)
  verified_min: 5              # verified badge requires official signal AND >= this
  confirmed_min: 3
  single_val: 2
  min_badge:                   # publish floor per site tier
    A: confirmed
    B: single
    C: single


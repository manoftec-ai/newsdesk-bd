name: auto-author
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Write drafts but do NOT commit/push"
        type: boolean
        default: false
  schedule:
    - cron: '17 * * * *'
  workflow_run:
    workflows: ["pipeline"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  # 2026-10-01: the "Deploy published stories now" step dispatches deploy.yml
  # through the API, and that call needs actions:write. Without it every
  # dispatch died with HTTP 403 while the step still reported success — stories
  # sat in main undeployed and the site went quiet. The step now also fails
  # loudly on a non-2xx code so a dead dispatch can never hide again.
  actions: write

concurrency:
  group: auto-author
  cancel-in-progress: false

jobs:
  author:
    runs-on: ubuntu-latest
    # 2026-09-29: the refresh safety net alone (fetch+normalize+cluster+verify
    # +extract on a 60MB store) takes ~28 min on a loaded runner; at 30 min the
    # job died on the finish line before pick/compose/finalize ever ran, so
    # nothing published despite a healthy brief pool. Headroom costs nothing
    # when runs are fast.
    timeout-minutes: 75
    env:
      # Hard cap on stories authored/published per run. Guards against a supply
      # spike (e.g. a source fix) turning one run into an unbounded, very long
      # batch. Override per-repo with the AUTHOR_MAX_PER_RUN variable.
      AUTHOR_MAX_PER_RUN: ${{ vars.AUTHOR_MAX_PER_RUN || '6' }}
      # 2026-09-27: the body-substance floor is 100 words of real prose, not 150.
      # The 150 existed to stop the writer stuffing 15-character fragments to reach
      # a count; the composer now refuses anything it cannot build from genuine
      # sentences. Left at 150 the finalizer rejected 12 of 12 composed articles as
      # BODY_SUBSTANCE_BLOCKED while the picker, which does not run the substance
      # check, kept selecting them.
      PUBLISH_MIN_WORDS: '100'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pipeline deps
        run: npm ci --no-audit --no-fund
        working-directory: pipeline

      # store.db lives on a release asset (>100MB cannot stay in git).
      - name: Restore store.db from the state release
        working-directory: pipeline
        run: GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} node tools/store_db_release.mjs download

      # Redundancy: GitHub has been delivering `schedule` events unreliably, so
      # auto-author also refreshes briefs itself (deduped by pipeline) instead of
      # waiting for pipeline.yml's cron to land. Exactly duplicates what
      # pipeline.yml does; harmless and idempotent when pipeline already ran.
      # 2026-10-01: this step used to re-run the ENTIRE pipeline (fetch,
      # normalize, cluster, verify, extract) before every publish. Measured on
      # run 1550: fetch 3.5min + normalize 18min + cluster 2s + verify 1s +
      # extract 22.5min = 44 minutes of a 60-minute job, for state
      # pipeline.yml had already produced AND committed to main in the same
      # window. The result was structural: publishing happened with ~15
      # minutes to spare before the job timeout, and two runs in a row were
      # killed at exactly 60 minutes (17:36) with a full batch of finished
      # stories still in the workspace. The site then showed nothing new for
      # five hours while every job stayed green.
      #
      # pipeline.yml owns that work (its own cron, 30 min) and commits
      # state/briefs, so this job now just uses them. The slow extract remains
      # ONLY as a fallback for the case where no briefs exist at all, so a
      # missed pipeline run can never leave this job with nothing to publish.
      - name: Use the briefs pipeline.yml already extracted
        working-directory: pipeline
        run: |
          if compgen -G "state/briefs/*.json" > /dev/null; then
            count=$(ls state/briefs/*.json | wc -l)
            echo "using $count brief(s) committed by the pipeline"
          else
            echo "no briefs on this checkout — extracting once as a fallback"
            node run.js extract || echo "::error::prior pipeline step failed (stage no longer silent)"
          fi

      - name: Resolve Google News wrappers to publisher articles
        working-directory: pipeline
        env:
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
        run: |
          # For the Cloudflare-walled outlets the pipeline fetches through Google
          # News search RSS, so item URLs arrive as news.google.com wrappers:
          # uncitable (the gate refuses them) and bodyless (a headline can never
          # reach the evidence floor). Measured 2026-09-27: 383 of 508
          # thin-evidence URLs were wrappers, 127 briefs had nothing but
          # wrappers. Resolving them recovered 113 full articles, cut the
          # evidence floor from 225 rejected briefs to 139, and put 38 briefs
          # straight through the full publication gate - all 38 published.
          #
          # The base64-protobuf decode that used to expose the publisher URL now
          # returns nothing; the page carries data-n-a-sg / data-n-a-ts, which
          # sign a batchexecute RPC returning the real URL.
          node tools/resolve_sources.mjs --concurrency=5 || echo "::error::prior pipeline step failed (stage no longer silent)"

      - name: Select newest unpublished briefs (deterministic)
        working-directory: pipeline
        run: |
          node tools/pick_briefs.mjs --max="$AUTHOR_MAX_PER_RUN" --out=state/pick.json

      - name: Clear stale writer bodies
        run: |
          rm -f pipeline/tmp/stories/*.b.md
          rm -f pipeline/tmp/finalize-rejections.json

      - name: Install opencode
        run: |
          curl -fsSL https://opencode.ai/install | bash -s -- --version 1.18.31
          echo "$HOME/.opencode/bin" >> $GITHUB_PATH

      # NOTE: no API key is required. The opencode gateway serves the default free
      # model (`opencode/big-pickle`) to headless `opencode run` WITHOUT auth —
      # verified 2026-09-20 keyless from a fresh profile; re-index touch. If the gateway ever
      # demands auth, set the OPENCODE_API_KEY secret (free, opencode.ai/auth) and
      # this step will pick it up automatically from the environment.

      # Authoring is DETERMINISTIC, not model-written. 2026-09-27: three model
      # configurations in a row failed identically - 6/6 stories rejected with
      # MECHANICAL_AUDIT_FAILED + PROMPT_LEAKED, bodies ~150 words against a
      # 180 floor, and the "quote not found" rejections were fragments of
      # lib/synth.mjs, i.e. the model echoing its own prompt back as the article.
      #
      # lib/compose.mjs now builds each body from the brief's own member leads:
      # every sentence is real source text, mechanically cleaned, and nothing is
      # invented to reach a word count - a brief whose sources cannot fill the
      # floor is refused instead. The finalizer below still adjudicates every
      # article through the full publication gate, so nothing bypasses review.
      #
      # tools/pick_briefs.mjs already proved each picked brief passes that gate
      # against the body the composer will write, so this step can no longer
      # produce a story that is doomed before the gate sees it.
      - name: Compose picked bodies deterministically
        id: author
        run: |
          git config user.name "newsdesk-bd-bot"
          git config user.email "bot@newsdesk-bd.local"
          mkdir -p pipeline/tmp/stories
          node pipeline/tools/compose_stories.mjs --pick=state/pick.json --max="${{ vars.AUTHOR_MAX_PER_RUN || 6 }}"

      - name: Reject direct public Markdown edits
        run: |
          if ! git diff --quiet -- site/src/content/news || ! git diff --cached --quiet -- site/src/content/news || [ -n "$(git ls-files --others --exclude-standard -- site/src/content/news)" ]; then
            echo "author changed site/src/content/news directly; refusing to continue"
            exit 1
          fi

      - name: Finalize gated stories atomically
        working-directory: pipeline
        run: |
          node tools/finalize_stories.mjs --pick=state/pick.json --site=../site/src/content/news --max="$AUTHOR_MAX_PER_RUN" --rejections=tmp/finalize-rejections.json

      - name: Preflight finalized public stories
        working-directory: pipeline
        run: |
          node tools/site_preflight.mjs --written=tmp/finalize-rejections.json --news=../site/src/content/news

      # 2026-10-02: the ঘটনাপঞ্জি chronicle was hand-typed and had gone stale —
      # 4 events, 60 records, all historical, and NOTHING in any workflow ever
      # wrote site/src/data/events-news.json, so every event marked "active" had
      # an empty chronicle. Run this BEFORE staging so the registry update lands
      # in the same commit and the same push as the stories themselves: one
      # atomic publish, one deploy, no window where a story is live but its
      # chronicle entry is missing.
      #
      # Entries are pointers to reports we already published and sourced (the
      # article's own headline, excerpt, date and primary source), and an
      # article with no source URL is refused rather than recorded unsourced.
      - name: Sync ঘটনাপঞ্জি chronicle with what we publish
        working-directory: pipeline
        run: |
          node tools/sync_chronicle.mjs --write --report=tmp/chronicle-sync.json

      - name: Upload chronicle sync record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chronicle-sync
          path: pipeline/tmp/chronicle-sync.json
          if-no-files-found: ignore

      # store.db lives on a release asset (>100MB cannot stay in git).
      - name: Publish store.db to the state release
        working-directory: pipeline
        run: GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} node tools/store_db_release.mjs upload

      # 2026-09-26: a rejected article was undiagnosable from CI. The finalizer
      # printed one line per story (which gate fired) and pipeline/tmp/ is
      # gitignored, so the per-rule detail - which rule inside the gate, and the
      # note explaining it - was never visible. Every later diagnosis had to be
      # inferred from code frequency in the log. This publishes the full record.
      - name: Report rejections to the run summary
        if: always()
        working-directory: pipeline
        run: |
          set -uo pipefail
          F=tmp/finalize-rejections.json
          if [ -f "$F" ]; then
            node tools/explain_rejections.mjs "$F" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No rejection record was produced.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload rejection record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finalize-rejections
          path: pipeline/tmp/finalize-rejections.json
          if-no-files-found: ignore

      - name: Stage only approved story files
        id: stage
        if: github.event.inputs.dry_run != 'true'
        run: |
          node pipeline/tools/stage_published.mjs --result=pipeline/tmp/finalize-rejections.json --site=site/src/content/news --stage
          # The chronicle registry travels with the stories in the same commit.
          git add site/src/data/events-news.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no story changes (nothing new or already committed)"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "newsdesk-bd-bot"
          git config user.email "bot@newsdesk-bd.local"
          git commit -m "auto-author: publish drafted stories ($(date -u +%Y%m%dT%H%M))"
          # Merge-style push that tolerates concurrent work landing on the same
          # files while we author (e.g. a parallel session authoring the same
          # brief). Non-conflicting files merge in; on add/add or content
          # conflicts keep the remote (already-published) version.
          #
          # 2026-10-01: one attempt was the reason the site went quiet for four
          # hours. Run 1550 wrote SIX approved stories, then found main had moved
          # (31e71a3c -> 40b9455a) while it worked, failed to merge, and threw
          # the whole batch away with "merge failed — abandoning push". Two
          # causes, both fixed here:
          #   a) a single attempt loses any race — pipeline.yml already retries
          #      3x for exactly this, auto-author never got that fix (D127);
          #   b) `git merge -X theirs` does NOT resolve add/add conflicts. When
          #      another writer published the same slug, git refuses the merge
          #      outright and -X cannot help, so the batch always died. The
          #      conflicted paths are now resolved explicitly: the remote copy
          #      wins, because it is already published and must never be
          #      overwritten by a re-authored version.
          pushed=""
          for attempt in 1 2 3; do
            git fetch origin main
            # NOTE: no 2>/dev/null on the merges. Suppressing git's stderr hid
            # the reason for four hours of lost batches ("merge failed —
            # abandoning push" with nothing to act on).
            if git merge --ff-only origin/main; then
              :
            elif git merge --no-edit -X theirs origin/main; then
              :
            else
              conflicts=$(git diff --name-only --diff-filter=U)
              if [ -n "$conflicts" ]; then
                echo "add/add conflict on: $conflicts — keeping the published (remote) file"
                git checkout --theirs -- $conflicts
                git add -- $conflicts
                if git commit --no-edit; then
                  :
                else
                  echo "merge failed (attempt $attempt of 3)"
                  git merge --abort 2>/dev/null || true
                  sleep 20
                  continue
                fi
              else
                echo "merge failed (attempt $attempt of 3)"
                git merge --abort 2>/dev/null || true
                sleep 20
                continue
              fi
            fi
            if git push origin HEAD:main; then pushed=1; break; fi
            echo "push raced (attempt $attempt of 3); re-merging"
            sleep 20
          done
          if [ -z "$pushed" ]; then
            # 2026-10-02: this used to exit 0 with published=false, which is how
            # a 20-hour outage stayed invisible — every job green, no new news.
            # A batch that cannot be landed is a REAL failure and now says so.
            echo "PUBLISH FAILED: the batch could not be pushed after 3 attempts."
            echo "Stories are written but NOT on main, and NOT deployed." >> "$GITHUB_STEP_SUMMARY"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "published=true" >> "$GITHUB_OUTPUT"

      # 2026-09-29: bot pushes made with GITHUB_TOKEN do not trigger
      # push-workflows (GitHub restriction), and the deploy schedule drops
      # ticks for hours — published stories sat 404 (national-694: on main
      # 11:23, still 404 at 12:41). So a run that just published dispatches
      # the deploy itself instead of hoping a trigger fires. Dispatches only
      # when this run actually pushed new story files, so quota is spent only
      # on real content changes.
      - name: Deploy published stories now
        if: steps.stage.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 10 \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy.yml/dispatches" \
            -d '{"ref":"main"}')
          echo "deploy dispatch -> HTTP $code"
          if [ "$code" -ge 300 ]; then
            echo "deploy dispatch FAILED (HTTP $code) — stories are on main but NOT deployed" >&2
            exit 1
          fi
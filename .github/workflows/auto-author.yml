name: auto-author
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Write drafts but do NOT commit/push"
        type: boolean
        default: false
  schedule:
    - cron: '17 * * * *'
  workflow_run:
    workflows: ["pipeline"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: auto-author
  cancel-in-progress: false

jobs:
  author:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Hard cap on stories authored/published per run. Guards against a supply
      # spike (e.g. a source fix) turning one run into an unbounded, very long
      # batch. Override per-repo with the AUTHOR_MAX_PER_RUN variable.
      AUTHOR_MAX_PER_RUN: ${{ vars.AUTHOR_MAX_PER_RUN || '6' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pipeline deps
        run: npm ci --no-audit --no-fund
        working-directory: pipeline

      # Redundancy: GitHub has been delivering `schedule` events unreliably, so
      # auto-author also refreshes briefs itself (deduped by pipeline) instead of
      # waiting for pipeline.yml's cron to land. Exactly duplicates what
      # pipeline.yml does; harmless and idempotent when pipeline already ran.
      - name: Refresh briefs (redundant safety net)
        working-directory: pipeline
        run: |
          node run.js fetch || true
          node run.js normalize || true
          node run.js cluster || true
          node run.js verify || true
          node run.js extract || true

      - name: Select newest unpublished briefs (deterministic)
        working-directory: pipeline
        run: |
          node tools/pick_briefs.mjs --max="$AUTHOR_MAX_PER_RUN" --out=state/pick.json

      - name: Install opencode
        run: |
          curl -fsSL https://opencode.ai/install | bash -s -- --version 1.18.31
          echo "$HOME/.opencode/bin" >> $GITHUB_PATH

      # NOTE: no API key is required. The opencode gateway serves the default free
      # model (`opencode/big-pickle`) to headless `opencode run` WITHOUT auth —
      # verified 2026-09-20 keyless from a fresh profile; re-index touch. If the gateway ever
      # demands auth, set the OPENCODE_API_KEY secret (free, opencode.ai/auth) and
      # this step will pick it up automatically from the environment.

      - name: Author unpublished briefs
        id: author
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          git config user.name "newsdesk-bd-bot"
          git config user.email "bot@newsdesk-bd.local"
          opencode run --auto --pure --model "${{ vars.OPENCODE_AUTHOR_MODEL || 'opencode/big-pickle' }}" "You are the newsdesk-bd story author.
          Work ONLY inside this repo. Follow AGENTS.md and memory/MEMORY.md.
          Task:
          1. Read pipeline/state/pick.json (written by pick_briefs.mjs — the
             newest unpublished briefs, pre-computed and sorted by published date).
             Author a story for EXACTLY the slugs in its 'picked' array. Never
             substitute, add, or skip any of them.
          2. If 'picked' is empty (or the file is missing), reply 'no unpublished
             briefs' and stop (exit 0).
          3. For each targeted slug, read its brief <slug>.json under
             pipeline/state/briefs/ for the facts, then write the Bengali article
             body only to pipeline/tmp/stories/<slug>.b.md (255-290 words,
             headlines in Bengali, numerals in Bengali, facts pinned strictly to the
             brief; end with the verification-confirmation paragraph using sources;
             NEVER add an editorial/draft footer).
          4. Then run: node pipeline/tools/finalize_stories.mjs --site=site/src/content/news --max=$AUTHOR_MAX_PER_RUN
             (or with --dry-run if DRY_RUN=true).
          5. Do NOT git commit, do NOT push, do NOT touch anything else.
          Always finish by printing a short summary listing files created."

      - name: Stage and push drafted stories
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "newsdesk-bd-bot"
          git config user.email "bot@newsdesk-bd.local"
          git add -A
          if git diff --cached --quiet; then
            echo "no story changes (nothing new or already committed)"
            exit 0
          fi
          git commit -m "auto-author: publish drafted stories ($(date -u +%Y%m%dT%H%M))"
          # Merge-style push that tolerates concurrent work landing on the same
          # files while we author (e.g. a parallel session authoring the same
          # brief). Non-conflicting files merge in; on add/add or content
          # conflicts keep the remote (already-published) version.
          git fetch origin main
          if git merge --ff-only origin/main 2>/dev/null; then
            :
          elif git merge --no-edit -X theirs origin/main 2>/dev/null; then
            :
          else
            echo "merge failed — abandoning push; batch re-authored on a later run"
            git merge --abort 2>/dev/null || true
            exit 0
          fi
          git push origin HEAD:main
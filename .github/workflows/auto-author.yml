name: auto-author
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Write drafts but do NOT commit/push"
        type: boolean
        default: false
  schedule:
    - cron: '17 * * * *'
  workflow_run:
    workflows: ["pipeline"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: auto-author
  cancel-in-progress: false

jobs:
  author:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Hard cap on stories authored/published per run. Guards against a supply
      # spike (e.g. a source fix) turning one run into an unbounded, very long
      # batch. Override per-repo with the AUTHOR_MAX_PER_RUN variable.
      AUTHOR_MAX_PER_RUN: ${{ vars.AUTHOR_MAX_PER_RUN || '6' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pipeline deps
        run: npm ci --no-audit --no-fund
        working-directory: pipeline

      # Redundancy: GitHub has been delivering `schedule` events unreliably, so
      # auto-author also refreshes briefs itself (deduped by pipeline) instead of
      # waiting for pipeline.yml's cron to land. Exactly duplicates what
      # pipeline.yml does; harmless and idempotent when pipeline already ran.
      - name: Refresh briefs (redundant safety net)
        working-directory: pipeline
        run: |
          node run.js fetch || true
          node run.js normalize || true
          node run.js cluster || true
          node run.js verify || true
          node run.js extract || true

      - name: Select newest unpublished briefs (deterministic)
        working-directory: pipeline
        run: |
          node tools/pick_briefs.mjs --max="$AUTHOR_MAX_PER_RUN" --out=state/pick.json

      - name: Clear stale writer bodies
        run: |
          rm -f pipeline/tmp/stories/*.b.md
          rm -f pipeline/tmp/finalize-rejections.json

      - name: Install opencode
        run: |
          curl -fsSL https://opencode.ai/install | bash -s -- --version 1.18.31
          echo "$HOME/.opencode/bin" >> $GITHUB_PATH

      # NOTE: no API key is required. The opencode gateway serves the default free
      # model (`opencode/big-pickle`) to headless `opencode run` WITHOUT auth —
      # verified 2026-09-20 keyless from a fresh profile; re-index touch. If the gateway ever
      # demands auth, set the OPENCODE_API_KEY secret (free, opencode.ai/auth) and
      # this step will pick it up automatically from the environment.

      # Jachai Lekhok — dedicated writer subagent (single source of truth: pipeline/lib/synth.mjs)
      # This agent does ONLY writing — no other tasks. Any change to synth.mjs ships automatically.
      # Globally available: .opencode/agent/jachai-lekhok.md (committed) + ~/.config/opencode/agent/jachai-lekhok.md
      # Switch model via repo variable OPENCODE_AUTHOR_MODEL (e.g. opencode/muse-spark-1.2-contributor-free)
      - name: Author picked bodies via Jachai Lekhok
        id: author
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          git config user.name "newsdesk-bd-bot"
          git config user.email "bot@newsdesk-bd.local"
          mkdir -p pipeline/tmp/stories /tmp
          opencode run --agent jachai-lekhok --auto --pure --model "${{ vars.OPENCODE_AUTHOR_MODEL || 'opencode/big-pickle' }}" "Read pipeline/state/pick.json. For every picked slug, run pipeline/tools/render_prompt.mjs and write only that slug's body to pipeline/tmp/stories/<slug>.b.md. Do not edit site Markdown, pipeline source, briefs, or any other path. Do not run git commands."

      - name: Reject direct public Markdown edits
        run: |
          if ! git diff --quiet -- site/src/content/news || ! git diff --cached --quiet -- site/src/content/news || [ -n "$(git ls-files --others --exclude-standard -- site/src/content/news)" ]; then
            echo "author changed site/src/content/news directly; refusing to continue"
            exit 1
          fi

      - name: Finalize gated stories atomically
        working-directory: pipeline
        run: |
          node tools/finalize_stories.mjs --pick=state/pick.json --site=../site/src/content/news --max="$AUTHOR_MAX_PER_RUN" --rejections=tmp/finalize-rejections.json

      - name: Preflight finalized public stories
        working-directory: pipeline
        run: |
          node tools/site_preflight.mjs --written=tmp/finalize-rejections.json --news=../site/src/content/news

      # 2026-09-26: a rejected article was undiagnosable from CI. The finalizer
      # printed one line per story (which gate fired) and pipeline/tmp/ is
      # gitignored, so the per-rule detail - which rule inside the gate, and the
      # note explaining it - was never visible. Every later diagnosis had to be
      # inferred from code frequency in the log. This publishes the full record.
      - name: Report rejections to the run summary
        if: always()
        working-directory: pipeline
        run: |
          set -uo pipefail
          F=tmp/finalize-rejections.json
          if [ -f "$F" ]; then
            node tools/explain_rejections.mjs "$F" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No rejection record was produced.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload rejection record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finalize-rejections
          path: pipeline/tmp/finalize-rejections.json
          if-no-files-found: ignore

      - name: Stage only approved story files
        if: github.event.inputs.dry_run != 'true'
        run: |
          node pipeline/tools/stage_published.mjs --result=pipeline/tmp/finalize-rejections.json --site=site/src/content/news --stage
          if git diff --cached --quiet; then
            echo "no story changes (nothing new or already committed)"
            exit 0
          fi
          git config user.name "newsdesk-bd-bot"
          git config user.email "bot@newsdesk-bd.local"
          git commit -m "auto-author: publish drafted stories ($(date -u +%Y%m%dT%H%M))"
          # Merge-style push that tolerates concurrent work landing on the same
          # files while we author (e.g. a parallel session authoring the same
          # brief). Non-conflicting files merge in; on add/add or content
          # conflicts keep the remote (already-published) version.
          git fetch origin main
          if git merge --ff-only origin/main 2>/dev/null; then
            :
          elif git merge --no-edit -X theirs origin/main 2>/dev/null; then
            :
          else
            echo "merge failed — abandoning push; batch re-authored on a later run"
            git merge --abort 2>/dev/null || true
            exit 0
          fi
          git push origin HEAD:main
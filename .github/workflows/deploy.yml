name: deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/src/**'
      - 'site/public/**'
      - 'site/package.json'
      - 'site/astro.config.mjs'

jobs:
  vercel:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel (production)
        working-directory: site
        run: npx vercel deploy . --prod --yes --token "$VERCEL_TOKEN" --scope man-of-technology --name newsdesk-bd
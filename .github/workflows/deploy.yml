name: deploy
on:
  workflow_dispatch:
  # Safety net: even if every bot trigger misses (schedule delivery has been
  # flaky), redeploy the current main tip at most every 15 min — the content
  # guard below skips when nothing in site/ changed since the last commit.
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - 'site/src/**'
      - 'site/public/**'
      - 'site/api/**'
      - 'site/package.json'
      - 'site/astro.config.mjs'
  # Bot workflows (auto-author, images, pipeline) push with the default
  # GITHUB_TOKEN, whose push events do NOT trigger push-based workflows.
  # So deploy also fires on their successful completion, and checks whether
  # the pushed commit actually changed site content first.
  workflow_run:
    workflows: [auto-author, images, pipeline, watcher, history-author]
    types: [completed]

jobs:
  vercel:
    runs-on: ubuntu-latest
    if: github.event.workflow_run == null || github.event.workflow_run.conclusion == 'success'
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      # IMPORTANT: do NOT checkout github.event.workflow_run.head_sha here.
      # For a dispatch/schedule-triggered run that head points at the ref SHA
      # when the run STARTED, not the commit the run later pushed (observed:
      # deploy kept deploying the pre-author commit and skipped site changes).
      # Checkout the current main tip — the triggering bot just pushed there.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check whether site content changed (bot/schedule run)
        if: github.event.workflow_run != null || github.event.schedule != null
        run: |
          if git rev-parse --verify -q HEAD~1 >/dev/null && \
             git diff --quiet HEAD~1 HEAD -- site/src site/public site/api site/package.json site/astro.config.mjs; then
            echo "DEPLOY_CHANGED=false" >> "$GITHUB_ENV"
          else
            echo "DEPLOY_CHANGED=true" >> "$GITHUB_ENV"
          fi

      - name: Deploy to Vercel (production)
        if: ${{ (github.event.workflow_run == null && github.event.schedule == null) || env.DEPLOY_CHANGED == 'true' }}
        working-directory: site
        run: npx vercel deploy . --prod --yes --token "$VERCEL_TOKEN" --scope man-of-technology --name newsdesk-bd
name: deploy
on:
  # Manual deploy — use when you want the current main tip live right now.
  workflow_dispatch:
  # 2026-09-28: the site went several hours with no new articles, and the cause
  # was not the author - auto-author published 5 articles at 10:26 and pushed
  # them. It was the trigger. This schedule says '17 * * * *', i.e. hourly, but
  # the real runs were 20:44, then 00:49, then 06:59: GitHub delayed and
  # dropped the cron ticks, so a story could sit finished and unpublished for
  # six hours with every check still green.
  #
  # A cron is the wrong clock for publishing news. So a push that changes
  # reader-visible content now deploys straight away, and the schedule stays as
  # the backstop for data-only refreshes.
  #
  # This does not put us back over Vercel's 100 deploys/day, which is why push
  # was removed in the first place. The 'Decide whether a deploy is needed' step
  # below asks Vercel which commit it is actually serving and exits before the
  # Vercel CLI when site/ is identical, so a push that changed nothing
  # reader-visible costs no deploy attempt. Only genuine content changes deploy.
  push:
    branches: [main]
    paths:
      - 'site/src/content/**'
      - 'site/src/pages/**'
      - 'site/src/components/**'
      - 'site/src/layouts/**'
      - 'site/src/lib/**'
      - 'site/src/config/**'
      - 'site/public/**'
      - 'site/api/**'
      - 'site/src/styles.css'
      - 'site/src/content.config.js'
      - 'site/package.json'
      - 'site/astro.config.mjs'
  # site/src/data is deliberately absent: event-graph.json is regenerated every
  # pipeline cycle, so including it would fire a deploy on every cycle for a
  # generated file. The hourly schedule still ships that refresh.
  # The ONLY automatic trigger.
  #
  # 2026-09-25: deploys were firing from four paths at once — push (29 runs),
  # workflow_dispatch (30), workflow_run (38) and this schedule (3). That is 100
  # attempts in a single day, and Vercel's Hobby plan allows 100 deploys/day.
  # 70 landed and 30 were rejected with `api-deployments-free-per-day`, after
  # which every deploy failed for the rest of the 24h window. Deleting old
  # deployments does NOT help: the counter tracks attempts, not retained
  # deployments, so pruning storage is unrelated to this limit.
  #
  # So: automatic deploying is hourly and nothing else. ~24/day, with headroom.
  # Bot pushes no longer deploy on their own — they go live on the next tick.
  # Minute 17 rather than 0, so this does not pile onto the top-of-hour rush
  # that every other cron on GitHub Actions also lands on.
  schedule:
    - cron: '17 * * * *'

# Auto-author and history-author can both land in the same window. Collapse a
# burst into one deploy, so the final state of main goes live once rather than
# twice, and a content push is not queued behind a scheduled tick.
concurrency:
  group: vercel-deploy
  cancel-in-progress: true

jobs:
  vercel:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # NOT named VERCEL_PROJECT_ID: the Vercel CLI claims that variable and then
      # demands VERCEL_ORG_ID alongside it, which fails the deploy. This is only
      # ever read by the guard step below.
      DEPLOY_PROJECT_ID: prj_FX5YmvjrSM5JnbCm1PNbQuJU6xJO
      # The hourly schedule is the guaranteed data-refresh deploy. Dispatches
      # from heartbeat.yml are guarded and may legitimately skip.
      FORCE_DEPLOY: ${{ github.event_name == 'schedule' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Decide by comparing site/ against what is ACTUALLY LIVE, rather than
      # against the previous commit.
      #
      # The old check was `git diff HEAD~1 HEAD`, which is wrong twice over: a
      # push can contain an earlier site-changing commit that HEAD~1 misses, and
      # it cannot tell whether that change was already deployed. Asking Vercel
      # which commit it is serving answers both.
      - name: Decide whether a deploy is needed
        id: decide
        run: |
          set -uo pipefail

          # Reader-visible paths only. site/src/data is deliberately NOT here:
          # event-graph.json is regenerated every pipeline cycle, so including
          # site/src as a whole made this guard fire on every single dispatch
          # even when not one article had changed. Generated data now rides
          # along with the next content deploy, and the hourly schedule below
          # still ships a data-only refresh, so it cannot go stale.
          SITE_PATHS='site/src/content site/src/pages site/src/components site/src/layouts site/src/lib site/src/config site/src/content.config.js site/src/styles.css site/public site/api site/package.json site/astro.config.mjs'

          if [ "${FORCE_DEPLOY:-false}" = "true" ]; then
            echo "Scheduled run: deploying regardless of diff, so generated data still refreshes." >&2
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LIVE=$(curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?limit=1&projectId=$DEPLOY_PROJECT_ID" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                try{const d=JSON.parse(s).deployments||[];
                process.stdout.write((d[0]&&d[0].meta&&d[0].meta.githubCommitSha)||"");}catch(e){}})')

          if [ -z "$LIVE" ]; then
            echo "Could not read the live deployment from Vercel; deploying to be safe." >&2
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Live commit: $LIVE   main: $(git rev-parse HEAD)" >&2

          # The live commit may predate our shallow clone. Pull just that one.
          git fetch --no-tags --depth=1 origin "$LIVE" 2>/dev/null || true

          if git cat-file -e "$LIVE^{commit}" 2>/dev/null; then
            if git diff --quiet "$LIVE" HEAD -- $SITE_PATHS; then
              echo "site/ is identical to the live deployment; skipping." >&2
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "site/ differs from the live deployment; deploying." >&2
          else
            echo "Live commit $LIVE not available locally; deploying to be safe." >&2
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Deploy to Vercel (production)
        if: steps.decide.outputs.deploy == 'true'
        working-directory: site
        run: npx vercel deploy . --prod --yes --token "$VERCEL_TOKEN" --scope man-of-technology --name newsdesk-bd

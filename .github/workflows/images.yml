# images.yml — add a branded WebP thumbnail for every article (auto, no Termux needed)
#
# Why: user rule (2026-09-19, permanent) — every article gets a brand-marked image, "different
# case different action" (mix photo + branded card), and it must run WITHOUT Termux being open
# (user: "i cant open my termux always ... is it possible through github?" -> YES: GH Actions).
#
# Trigger strategy:
#   - push to main touching site/src/content/news/** (new/changed articles) -> brand them right away
#   - schedule */30 (catch-up pass: picks up any article that lacked a thumbnail, incl. brand refresh)
#   - manual (workflow_dispatch)
#
# Generates via pipeline/tools/add_images.mjs: Openverse (free-license, commercial+modification,
# no API key) photo -> WebP 1200x675 with brand overlay; else a branded category card. WebP lives
# at site/public/images/<slug>.webp, front matter gets thumbnail/thumbnailAlt. Committed+updated
# by this job (rebase before push to avoid racing the 5-min pipeline job). Vercel auto-deploys on push.
#
# concurrency:
#   - with pipeline.yml (only commits on real state change): use pull --rebase so both can coexist.
name: images
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/src/content/news/**"
  # Deterministic chain: whenever a bot workflow can land new/changed articles
  # (auto-author publishes batches, pipeline refreshes briefs, watcher updates
  # tracked stories), brand thumbnails right after — do NOT rely on schedule
  # delivery, which GitHub has been dropping this week.
  workflow_run:
    workflows: [auto-author, watcher, pipeline, history-batch]
    types: [completed]
  schedule:
    - cron: "17,47 * * * *" # 1 min offset from pipeline.yml cron, avoids lockstep

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  # 2026-10-01: the "Deploy new thumbnails now" step dispatches deploy.yml
  # through the API (actions:write), for the same reason as auto-author — a
  # 403 here is silent and leaves thumbnails undeployed.

jobs:
  add:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pipeline/package-lock.json

      - name: Point fontconfig at bundled Bengali fonts (no apt)
        run: |
          echo "FONTCONFIG_FILE=$GITHUB_WORKSPACE/pipeline/fonts/fontconfig.local.conf" >> "$GITHUB_ENV"

      - name: Install pipeline deps (incl. sharp)
        run: npm ci --no-audit --no-fund

      - name: Add branded WebP thumbnails
        run: node tools/add_images.mjs --write --strategy=mix
        env:
          OPENVERSE_USER_AGENT: "jachaidesk/1.0 (https://jachaidesk.com)"
          NODE_OPTIONS: "--max-old-space-size=1024"

      - name: Ensure fallback social image (og-default.png)
        run: node tools/make_og_default.mjs
        env:
          NODE_OPTIONS: "--max-old-space-size=1024"

      - name: Commit + push (branded images + front matter)
        id: thumbs
        run: |
          cd ..
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "newsdesk-bd-bot"
            git config user.email "bot@newsdesk-bd.local"
            git add site/public/images site/src/content/news
            git -c commit.gpgsign=false commit -m "pipeline: brand thumbnail images (auto, $(date -u +%Y%m%dT%H%M))"
            # Merge-style push tolerant of concurrent workers (auto-author etc.)
            git fetch origin main
            if git merge --ff-only origin/main 2>/dev/null; then
              :
            elif git merge --no-edit -X theirs origin/main 2>/dev/null; then
              :
            else
              echo "merge failed — abandoning push; thumbnails re-created on a later images run"
              git merge --abort 2>/dev/null || true
              exit 0
            fi
            git push && echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # 2026-09-30: same lesson as auto-author (D129) — a bot push made with
      # GITHUB_TOKEN does not trigger push-workflows, and the hourly deploy
      # schedule has been dropping ticks for hours at a time (nothing between
      # 06:46 and 13:48 on Sep-30). New stories went live imageless because
      # their thumbnails sat in main undeployed. So a run that just landed
      # thumbnails dispatches the deploy itself. Dispatches only when this run
      # actually pushed, and deploy.yml's own guard still skips when site/ is
      # identical to live, so quota is spent only on real content changes.
      - name: Deploy new thumbnails now
        if: steps.thumbs.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 10 \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy.yml/dispatches" \
            -d '{"ref":"main"}')
          echo "deploy dispatch -> HTTP $code"
          if [ "$code" -ge 300 ]; then
            echo "deploy dispatch FAILED (HTTP $code) — thumbnails are on main but NOT deployed" >&2
            exit 1
          fi
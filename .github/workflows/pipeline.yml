name: pipeline
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Sync BEFORE doing any work, not after.
      #
      # This run owns pipeline/state/store.db, a mutable SQLite file. The old
      # order was: do all the work, commit, then `git merge -X theirs
      # origin/main`. That flag means "on conflict keep the other side", and
      # for a binary database it does not avoid the conflict, it silently
      # discards the fetch this run just performed. Measured 2026-09-27:
      # the pipeline commit held max(seen_at)=18:38 with 10,596 rows, the
      # merge came out at max(seen_at)=17:48 with 10,565 — 31 freshly
      # enriched rows thrown away, so the author step downstream saw no new
      # briefs and published nothing, every 30 minutes.
      #
      # Rebasing onto origin/main first means the commit is built on the
      # newest main and the push below is a plain fast-forward, so there is
      # nothing to merge and nothing to lose.
      - name: Sync with main before fetching
        run: |
          set -uo pipefail
          git config user.name "newsdesk-bd-bot"
          git config user.email "bot@newsdesk-bd.local"
          git fetch --no-tags origin main
          git rebase origin/main || {
            echo "could not rebase onto origin/main; continuing on current HEAD"
          }
          echo "synced to $(git rev-parse --short HEAD)"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pipeline deps
        run: npm ci --no-audit --no-fund

      - name: Fetch
        run: node run.js fetch || true

      - name: Normalize
        run: node run.js normalize || true

      - name: Cluster
        run: node run.js cluster || true

      # Developing lane (2026-09-30): promote qualifying first-sightings to
      # solo clusters BEFORE verify scores them, so extract briefs them in
      # this same run. Tier-A outlets, fat direct bodies, capped per run.
      - name: Promote developing first-sightings
        run: node tools/promote_developing.mjs --max=5 --write || true

      - name: Verify
        run: node run.js verify || true

      - name: Backfill thin article bodies
        run: |
          # Re-fetch real bodies for stored items that only ever got a headline.
          #
          # This tool has existed since 2026-09-25 but was never wired into any
          # workflow, so it had never run in CI. It has to run BEFORE extract:
          # the brief builder reads raw_items.body, so enriching afterwards would
          # be discarded by the next run — which is the same class of bug as
          # insertRawItem discarding a duplicate's enriched body.
          #
          # --days=3 keeps the budget on recent news instead of the 5,800 items
          # older than a week. --resolve-gnews is required: the top thin items
          # are news.google.com wrappers, which cannot be fetched until decoded
          # (4 of 6 in a dry run failed with gnews_not_resolved without it).
          # --write is needed for it to persist; it is dry-run without.
          # A brief clears the evidence gate if ANY ONE member carries 100+
          # words, so the cheapest win is the member already closest to the
          # line -- not the newest item in the store. Measured on the live
          # store: 464 of 587 briefs fail with a best member of 16-60 words,
          # while 123 already have a member over 100. Targeting those members
          # instead of the newest items took the hit rate from 17% to 70%:
          #
          #   --days=3 --skip-unusable   attempted 10  improved 3  failed 0
          #   --target=failing-briefs    attempted 10  improved 7  failed 0
          #
          # At 70%, 150 per run unblocks ~105 briefs, so the 464 clear in
          # roughly five runs rather than months of newest-first grinding.
          ENRICH_TIMEOUT_MS=10000 node tools/enrich_bodies.mjs \
            --limit=150 --target=failing-briefs --resolve-gnews --skip-unusable --write \
            || echo "body backfill failed or timed out; briefs rebuild from what we have"

      - name: Re-extract brief evidence with the paragraph scorer
        run: |
          # A second, complementary top-up to enrich_bodies above.
          #
          # enrich_bodies reads the largest article/main container and is
          # already effective, but it is a different extractor from the one that
          # builds brief evidence. resolve_sources --retext uses the paragraph
          # scorer in lib/article-text.mjs, which is stricter about furniture
          # and so recovers bodies enrich_bodies gives up on - and which, until
          # 2026-09-28, rejected any paragraph under 12 words and only kept the
          # longest CONSECUTIVE run, so a single one-sentence quote truncated a
          # normal article to one paragraph. A/B on the briefs that were
          # starving the pipeline: 2794 -> 4001 evidence words across 13 URLs.
          #
          # It was in no workflow at all, which is why the pool had to be refilled
          # by hand. Measured on the run that proved it: 275 bodies recovered,
          # 109 briefs updated, and pending briefs went 0 -> 3.
          #
          # --limit keeps the 30-minute cycle quick; the pool refills over
          # several cycles rather than in one long step, and a failure here only
          # means the next cycle tries again.
          node tools/resolve_sources.mjs --retext --limit=40 \
            || echo "brief re-extraction failed; the pool will be topped up next cycle"

      - name: Extract briefs
        run: node run.js extract || true

      - name: Corrections + auto re-verification
        run: |
          node tools/reverify_stories.mjs --max=50 || echo "reverify skipped/failed (harmless)"

      - name: Cluster quality (golden test dataset)
        run: |
          node tools/cluster_eval.mjs || echo "cluster-eval skipped/failed (harmless)"

      - name: Actor registry (entity resolution)
        run: |
          node tools/entity_index.mjs || echo "entity_index skipped/failed (harmless)"

      - name: Contradiction detector (structured conflicts)
        run: |
          node tools/detect_conflicts.mjs || echo "detect_conflicts skipped/failed (harmless)"

      - name: Source health (reliability profile)
        run: |
          node tools/source_health.mjs || echo "source_health skipped/failed (harmless)"

      - name: Story event graph (site data)
        run: |
          node tools/event_graph.mjs || echo "event_graph skipped/failed (harmless)"

      - name: Commit state
        run: |
          git config user.name "newsdesk-bd-bot"
          git config user.email "bot@newsdesk-bd.local"
          git add -A
          if git diff --cached --quiet; then
            echo "no state change"
          else
            git commit -m "pipeline: fetch/verify/extract (auto, $(date -u +%Y%m%dT%H%M))"
            # Merge-style push tolerant of concurrent workers (auto-author etc.)
            # 2026-09-29: one shot was not enough — with several writers pushing
            # every few minutes the fetch→merge→push window routinely lost the
            # race and the run abandoned its state ("merge failed — abandoning
            # push"), so enrichment/clustering work kept being recomputed and
            # dropped. Retry the whole fetch→merge→push up to 3 times; each
            # attempt re-fetches, so a raced push just merges again instead of
            # abandoning. Conflict semantics unchanged (theirs wins, our
            # store.db restored below).
            OURS=""
            pushed=""
            for attempt in 1 2 3; do
              git fetch origin main
              OURS=$(git rev-parse HEAD)
              if git merge --ff-only origin/main 2>/dev/null; then
                :
              elif git merge --no-edit -X theirs origin/main 2>/dev/null; then
                # A concurrent writer (auto-author, images) landed on main while
                # this run was working. Taking "theirs" is right for the small
                # JSON state files — the next run re-derives those — but it is
                # catastrophic for store.db, which is the only copy of the fetch
                # this run just did. Put our database back and amend the merge.
                if git diff --quiet "$OURS" HEAD -- pipeline/state/store.db; then
                  echo "merge kept our store.db (no conflict on it)"
                else
                  echo "merge replaced our store.db — restoring ours and amending"
                  git checkout "$OURS" -- pipeline/state/store.db
                  git commit --amend --no-edit
                fi
              else
                echo "merge failed (attempt $attempt of 3)"
                git merge --abort 2>/dev/null || true
                sleep 20
                continue
              fi
              if git push; then pushed=1; break; fi
              echo "push raced (attempt $attempt of 3); re-merging"
              sleep 20
            done
            if [ -z "$pushed" ]; then
              echo "merge failed — abandoning push; briefs re-fetched on a later pipeline run"
              git merge --abort 2>/dev/null || true
              exit 0
            fi
          fi

      - name: Poke IndexNow (Bing/Yandex quick index)
        run: |
          key="59b9d831dc064ecffbbcf0618ce0a97c"
          urlList=$(ls ../site/src/content/news/*.md 2>/dev/null | sed -E 's#^.*/([^/]+)\.md$#https://jachaidesk.com/article/\1#' | sort -u | jq -R -s -c 'split("\n") | map(select(length>0))')
          if [ -n "$urlList" ] && [ "$urlList" != "[]" ]; then
            body=$(jq -n --arg host "jachaidesk.com" --arg key "$key" --argjson urlList "$urlList" \
              '{host:$host,key:$key,keyLocation:("https://jachaidesk.com/"+$key+".txt"),urlList:$urlList}')
            curl -s -o /dev/null -w "IndexNow HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
              -H 'Content-Type: application/json; charset=utf-8' -d "$body"
          fi
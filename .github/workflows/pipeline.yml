name: pipeline
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pipeline deps
        run: npm ci --no-audit --no-fund

      - name: Fetch
        run: node run.js fetch || true

      - name: Normalize
        run: node run.js normalize || true

      - name: Cluster
        run: node run.js cluster || true

      - name: Verify
        run: node run.js verify || true

      - name: Extract briefs
        run: node run.js extract || true

      - name: Commit state
        run: |
          git config user.name "newsdesk-bd-bot"
          git config user.email "bot@newsdesk-bd.local"
          git add -A
          if git diff --cached --quiet; then
            echo "no state change"
          else
            git commit -m "pipeline: fetch/verify/extract (auto, $(date -u +%Y%m%dT%H%M))"
            # Merge-style push tolerant of concurrent workers (auto-author etc.)
            git fetch origin main
            if git merge --ff-only origin/main 2>/dev/null; then
              :
            elif git merge --no-edit -X theirs origin/main 2>/dev/null; then
              :
            else
              echo "merge failed — abandoning push; briefs re-fetched on a later pipeline run"
              git merge --abort 2>/dev/null || true
              exit 0
            fi
            git push
          fi

      - name: Poke IndexNow (Bing/Yandex quick index)
        run: |
          key="59b9d831dc064ecffbbcf0618ce0a97c"
          urlList=$(ls ../site/src/content/news/*.md 2>/dev/null | sed -E 's#^.*/([^/]+)\.md$#https://newsdesk-bd.vercel.app/article/\1#' | sort -u | jq -R -s -c 'split("\n") | map(select(length>0))')
          if [ -n "$urlList" ] && [ "$urlList" != "[]" ]; then
            body=$(jq -n --arg host "newsdesk-bd.vercel.app" --arg key "$key" --argjson urlList "$urlList" \
              '{host:$host,key:$key,keyLocation:("https://newsdesk-bd.vercel.app/"+$key+".txt"),urlList:$urlList}')
            curl -s -o /dev/null -w "IndexNow HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
              -H 'Content-Type: application/json; charset=utf-8' -d "$body"
          fi
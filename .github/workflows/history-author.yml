# history-author.yml — Ghotona Pongji automation (F7)
#
# Runs weekly (Mon 03:00 UTC = 09:00 BD). Two jobs:
#   1. plan  — runs pipeline/tools/event_scheduler.mjs and commits the plan as a
#      machine-readable report under pipeline/state/history-plan.json, so opencode
#      (or the user) can see exactly which events to author next.
#   2. author — authors+publishes Tier-1 hubs with pipeline/tools/history_author.mjs
#      using --publish-all: every event that has a CURATED description goes live
#      automatically (draft:false). Events without a curated description are refused
#      (no-fabrication rule) — the weekly run "drains the queue" as descriptions are
#      curated over time. No LLM used.
#
# Free GH Actions + zero budget. No VPS, no Termux.
name: history-author
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1' # 03:00 UTC Mon = 09:00 BD

permissions:
  contents: write

concurrency:
  group: history-author
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    outputs:
      plan_json: ${{ steps.plan.outputs.PLAN_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate plan report
        id: plan
        run: |
          node tools/event_scheduler.mjs --waiting-days=7 > plan.txt
          mkdir -p state
          node tools/event_scheduler.mjs --waiting-days=7 --json > state/history-plan.json
          printf 'PLAN_JSON=' >> "$GITHUB_OUTPUT"
          jq -c '. | map(.id)' state/history-plan.json >> "$GITHUB_OUTPUT"
          cat plan.txt

      - name: Commit plan
        run: |
          git config user.name "newsdesk-bd-history"
          git config user.email "history@newsdesk-bd.local"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "ghotona-pongji: weekly event plan (auto, $(date -u +%Y%m%dT%H%M))"
          git pull --rebase origin main || true
          git push

  author:
    needs: plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Author + publish Tier-1 hubs (curated descriptions only)
        run: |
          # Every event with a curated DESCRIPTIONS entry in history_author.mjs is
          # written/flipped to draft:false in one pass. Events without one are
          # refused (no fabrication) — they join future runs once curated.
          node tools/history_author.mjs --publish-all
          git add -A
          git config user.name "newsdesk-bd-history"
          git config user.email "history@newsdesk-bd.local"
          if git diff --cached --quiet; then
            echo "no new hubs"
            exit 0
          fi
          git commit -m "ghotona-pongji: tier-1 hubs published (auto, $(date -u +%Y%m%dT%H%M))"
          git pull --rebase origin main || true
          git push
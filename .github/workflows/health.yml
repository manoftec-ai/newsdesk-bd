name: health
on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * *' # daily 06:23 UTC

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth 0 on purpose. The stall check reads real git history for
          # site/src/content/news; a shallow clone would report "unknown recency"
          # and fail forever.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Pipeline health check
        # 2026-10-02: this was an inline `node -e` blob that mixed ESM `import`
        # with `require('fs')` — so the job died on every run with
        # `require is not defined` — and measured file mtimes, which checkout
        # rewrites to "now", so its 36-hour stall test could never fire.
        # Both faults and their fixes are documented in the tool.
        run: node pipeline/tools/health_check.mjs --news=site/src/content/news --pick=pipeline/state/pick.json
      - name: Raise one issue if stalled
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # 2026-10-02: reuses the open issue and comments the latest reading.
        # Previously every failed run posted a brand-new identical issue, and the
        # POST 422'd whenever the `health` label did not exist yet.
        run: node pipeline/tools/health_issue.mjs --news=site/src/content/news --pick=pipeline/state/pick.json
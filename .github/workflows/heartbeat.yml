name: heartbeat

# WHY THIS EXISTS
# GitHub's `schedule` trigger drops events frequently (GitHub documents this). Our
# `pipeline.yml` cron '*/30 * * * *' was actually firing only a few times a day,
# so the whole news desk sat idle for hours and produced no new stories.
#
# This heartbeat does NOT depend on schedule reliability. Once started, it keeps a
# small runner alive and EXPLICITLY dispatches `images.yml` + `pipeline.yml` +
# `auto-author.yml` + `deploy.yml`. Before GitHub's 6-hour job limit it dispatches
# a fresh copy of itself, so the chain is self-sustaining.
#
# DISPATCH ORDER MATTERS (learned the hard way):
# - `images.yml` is dispatched here directly because its `workflow_run` trigger
#   proved unreliable for heartbeat-dispatched runs (articles were left without
#   thumbnails). images.yml is a catch-up pass, safe to run every cycle.
# - pipeline -> auto-author must be POLLED (not fixed sleep): pipeline takes ~8 min
#   to fetch+verify+extract+push. Dispatching auto-author after 300s made it read a
#   full cycle of STALE briefs, so new stories were never picked. Now auto-author is
#   dispatched only AFTER the pipeline push actually completes.
# - deploy.yml is dispatched only AFTER auto-author completes, because its
#   `workflow_run` trigger is ALSO unreliable for heartbeat-dispatched runs (site
#   froze at a 14:53 deploy while auto-author kept publishing). This guarantees new
#   verified stories reach the live homepage within the same ~30-min cycle.
# - Cycle pacing is 30 min so each source is fetched at most once per 30 min
#   (be-nice-to-sources rule).
#
# The `schedule` entries below are only a cold-start backup for the chain.

on:
  schedule:
    - cron: '13 */3 * * *'
    - cron: '43 1,7,13,19 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: heartbeat
  cancel-in-progress: true

jobs:
  pump:
    runs-on: ubuntu-latest
    timeout-minutes: 190
    steps:
      - name: Pump pipeline -> auto-author -> deploy on a 30-min cadence, then hand off
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          dispatch () {
            code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/workflows/$1/dispatches" \
              -d '{"ref":"main"}')
            echo "$(date -u +%H:%M:%S) dispatch $1 -> HTTP $code"
          }
          # Wait until a workflow run that we dispatched (created after $since)
          # reaches 'completed'. Prints progress; exits 0=success, 3=failure,
          # 2=timeout. Callers continue on any outcome.
          poll () {
            node -e '
              const gh = process.env.GH_TOKEN, repo = process.env.REPO;
              const wf = process.argv[1], since = Number(process.argv[2]), max = Number(process.argv[3]) || 50;
              const sleep = ms => new Promise(r => setTimeout(r, ms));
              (async () => {
                for (let i = 0; i < max; i++) {
                  let runs = [];
                  try {
                    const r = await fetch(`https://api.github.com/repos/${repo}/actions/workflows/${wf}/runs?per_page=5`, {
                      headers: { Authorization: `Bearer ${gh}`, Accept: "application/vnd.github+json", "User-Agent": "newsdesk-heartbeat" }
                    });
                    runs = (await r.json()).workflow_runs || [];
                  } catch (e) { /* transient API error */ }
                  const mine = runs.filter(x => new Date(x.created_at).getTime() >= since)
                                   .sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
                  if (mine.length) {
                    const last = mine[mine.length - 1];
                    if (last.status === "completed") {
                      console.log(`[${new Date().toISOString()}] ${wf}: ${last.conclusion || "completed"}`);
                      process.exit(last.conclusion === "success" ? 0 : 3);
                    }
                    console.log(`[${new Date().toISOString()}] ${wf}: ${last.status}`);
                  } else {
                    console.log(`[${new Date().toISOString()}] ${wf}: not-started`);
                  }
                  await sleep(15000);
                }
                console.log(`[${new Date().toISOString()}] ${wf}: TIMEOUT`);
                process.exit(2);
              })();
            ' "$1" "$2" "$3"
          }

          CYCLES=5
          for i in $(seq 1 $CYCLES); do
            echo "--- cycle $i/$CYCLES ---"
            t0=$(date +%s)
            dispatch images.yml
            dispatch pipeline.yml
            poll pipeline.yml "$t0" 50 || echo "pipeline not confirmed, continuing"
            t1=$(date +%s)
            dispatch auto-author.yml
            poll auto-author.yml "$t1" 100 || echo "auto-author not confirmed, continuing"
            t2=$(date +%s)
            dispatch deploy.yml
            # Pace the cycle to ~30 min so the next pipeline fetch is >= 30 min
            # after the previous one (be-nice-to-sources rule).
            elapsed=$(( $(date +%s) - t0 ))
            rem=$(( 1800 - elapsed ))
            echo "cycle elapsed ${elapsed}s, sleeping ${rem}s to keep a 30-min cadence"
            if [ "$rem" -gt 0 ]; then sleep "$rem"; fi
          done
          echo "handing off to a fresh heartbeat"
          dispatch heartbeat.yml
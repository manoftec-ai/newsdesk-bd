name: heartbeat

# WHY THIS EXISTS
# GitHub's `schedule` trigger drops events frequently (GitHub documents this). Our
# `pipeline.yml` cron '*/30 * * * *' was actually firing only a few times a day,
# so the whole news desk sat idle for hours and produced no new stories.
#
# This heartbeat does NOT depend on schedule reliability. Once started, it keeps a
# small runner alive and EXPLICITLY dispatches `images.yml` + `pipeline.yml` +
# `auto-author.yml` every 30 minutes. Before GitHub's 6-hour job limit it dispatches
# a fresh copy of itself, so the chain is self-sustaining.
#
# NOTE: `images.yml` is dispatched here directly because its `workflow_run` trigger
# proved unreliable for heartbeat-dispatched runs — articles published after the last
# images run were left without thumbnails (e.g. sports-255). images.yml is a catch-up
# pass (brands every article missing a thumbnail), so running it each cycle is safe.
# The `schedule` entries below are only a cold-start backup for the chain.

on:
  schedule:
    - cron: '13 */3 * * *'
    - cron: '43 1,7,13,19 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: heartbeat
  cancel-in-progress: true

jobs:
  pump:
    runs-on: ubuntu-latest
    timeout-minutes: 190
    steps:
      - name: Pump pipeline + auto-author every 30 min, then hand off
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          dispatch () {
            code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/workflows/$1/dispatches" \
              -d '{"ref":"main"}')
            echo "$(date -u +%H:%M:%S) dispatch $1 -> HTTP $code"
          }
          for i in 1 2 3 4 5 6; do
            echo "--- cycle $i ---"
            dispatch images.yml
            dispatch pipeline.yml
            sleep 300
            dispatch auto-author.yml
            sleep 1500
            # Explicit deploy each cycle: deploy.yml's `workflow_run` trigger ALSO
            # proved unreliable for heartbeat-dispatched bot runs (site froze at the
            # 14:53 deploy although auto-author kept pushing new stories). deploy.yml
            # supports workflow_dispatch, so have the heartbeat publish every cycle.
            dispatch deploy.yml
          done
          echo "handing off to a fresh heartbeat"
          dispatch heartbeat.yml

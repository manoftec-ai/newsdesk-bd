name: heartbeat

# WHY THIS EXISTS
# GitHub's `schedule` trigger drops events frequently (GitHub documents this). Our
# `pipeline.yml` cron '*/30 * * * *' was actually firing only a few times a day,
# so the whole news desk sat idle for hours and produced no new stories.
#
# This heartbeat does NOT depend on schedule reliability. Once started, it keeps a
# small runner alive and EXPLICITLY dispatches `pipeline.yml` (which in turn triggers
# `auto-author.yml` via workflow_run) every 30 minutes. Before GitHub's 6-hour job
# limit it dispatches a fresh copy of itself, so the chain is self-sustaining.
# The `schedule` entries below are only a cold-start backup for the chain.

on:
  schedule:
    - cron: '13 */3 * * *'
    - cron: '43 1,7,13,19 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: heartbeat
  cancel-in-progress: true

jobs:
  pump:
    runs-on: ubuntu-latest
    timeout-minutes: 190
    steps:
      - name: Pump pipeline + auto-author every 30 min, then hand off
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          dispatch () {
            code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/workflows/$1/dispatches" \
              -d '{"ref":"main"}')
            echo "$(date -u +%H:%M:%S) dispatch $1 -> HTTP $code"
          }
          for i in 1 2 3 4 5 6; do
            echo "--- cycle $i ---"
            dispatch pipeline.yml
            sleep 300
            dispatch auto-author.yml
            sleep 1500
          done
          echo "handing off to a fresh heartbeat"
          dispatch heartbeat.yml
